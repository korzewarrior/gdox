server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gdox.korze.org;

    ssl_certificate /etc/letsencrypt/live/gdox.korze.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gdox.korze.org/privkey.pem;

    include /etc/nginx/snippets/require-cloudflare-origin.conf;
    include /etc/nginx/snippets/static-site-security-headers.conf;

    absolute_redirect off;

    if ($request_uri ~ "^(.*/)index\.html(?:\?|$)") {
        return 301 https://gdox.korze.org$1$is_args$args;
    }

    if ($http_x_forwarded_proto = "http") {
        return 301 https://gdox.korze.org$request_uri;
    }

    root /var/www/sites/gdox.korze.org/public;
    index index.html;

    access_log /var/www/sites/gdox.korze.org/logs/access.log;
    error_log  /var/www/sites/gdox.korze.org/logs/error.log;

    limit_req zone=general burst=20 nodelay;

    location ~ /\.(?!well-known) {
        deny all;
    }

    include /etc/nginx/snippets/static-source-deny.conf;

    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/static-site-security-headers.conf;
    }

    location ~ ^/contribute(?:/index\.html)?/?$ {
        return 301 "https://gdox.korze.org/drives/#send-a-drive";
    }

    location ~ ^/how-it-works(?:/index\.html)?/?$ {
        return 301 "https://gdox.korze.org/wtf/";
    }

    location = /downloads {
        return 404;
    }

    location ~ ^/downloads/[0-9][^/]*/SHA256SUMS(?:\.minisig)?$ {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "public, max-age=300, s-maxage=300" always;
        include /etc/nginx/snippets/static-site-security-headers.conf;
    }

    location /downloads/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        include /etc/nginx/snippets/static-site-security-headers.conf;
    }

    location ~* ^/(?:releases?|source|github|forgejo)(?:/|$) {
        return 404;
    }

    location ~* ^/(?!downloads/).+\.(?:zip|tgz|tar(?:\.(?:gz|xz|zst))?|7z|dmg|pkg|exe|msi|appimage|deb|rpm|apk)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300, s-maxage=300" always;
        include /etc/nginx/snippets/static-site-security-headers.conf;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        include /etc/nginx/snippets/static-site-security-headers.conf;
    }

    location /schemas/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        include /etc/nginx/snippets/static-site-security-headers.conf;
    }
}
